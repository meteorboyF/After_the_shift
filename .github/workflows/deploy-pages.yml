name: Deploy frontend to GitHub Pages

# The hosted build is the guard-facing app only. The Spring Boot backend needs
# a JVM host and is not deployed here, which the app handles by design: writes
# go to IndexedDB and the summary screens seed themselves when no API is
# configured. See frontend/src/lib/demoSeed.js.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Build
        working-directory: frontend
        # Pages serves this from /After_the_shift/, so asset URLs and the
        # router basename both need the subpath baked in at build time.
        env:
          BASE_PATH: /After_the_shift/
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
