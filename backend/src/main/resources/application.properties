spring.application.name=after-the-shift

# File-based H2 so demo data survives a restart.
spring.datasource.url=jdbc:h2:file:./data/afthershift;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Voice notes are base64 audio blobs; the defaults are too small for them.
spring.servlet.multipart.max-file-size=16MB
spring.servlet.multipart.max-request-size=16MB
server.tomcat.max-http-form-post-size=16MB
server.tomcat.max-swallow-size=16MB

# Guards work a Dhaka campus; day boundaries and the heaviest-hour figure are
# computed in their local time, not the server's.
app.timezone=Asia/Dhaka

# Seed demo data on first run (see demo/DataSeeder).
spring.profiles.active=demo
